<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EA 360</title>
<meta name="theme-color" content="#0f1f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EA 360">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface2:#f7f9f8; --ink:#161b1a; --ink2:#4b5451;
  --ink3:#7e8885; --line:#e3e8e6; --accent:#0c7268; --accent-2:#0a5f57; --accent-soft:#e2f1ee;
  --accent-on:#ffffff; --gold:#b3873c; --side:#0f1f1c;
  --ok:#0ca30c; --ok-t:#e2f3e2; --ok-ink:#0a6e0a;
  --warn-t:#fdf0d3; --warn-ink:#7a5405; --bad:#d03b3b; --bad-t:#f9e2e2; --bad-ink:#9c2626;
  --c1:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d100f; --surface:#161b1a; --surface2:#1b2120; --ink:#eef2f1; --ink2:#b6c0bd;
    --ink3:#89938f; --line:#262d2b; --accent:#2aa79a; --accent-2:#3dbcae; --accent-soft:#11312c;
    --accent-on:#06211d; --gold:#d2a75f;
    --ok-t:#123312; --ok-ink:#7bd47b; --warn-t:#332a10; --warn-ink:#f4c964;
    --bad:#e66767; --bad-t:#391616; --bad-ink:#f09c9c; --c1:#3987e5;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14.5px/1.5 "Instrument Sans","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.9em}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:560px){
  body{padding:24px 0;background:linear-gradient(160deg,#0f1f1c,#1a2f2a)}
  #app{height:calc(100dvh - 48px);border-radius:34px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08)}
}
.aHead{
  display:flex;align-items:center;gap:11px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;
  background:var(--side);color:#e7eeec;
}
.aHead .mark{flex:0 0 32px}
.aHead h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.2px;flex:1}
.aHead h1 small{display:block;font-size:10.5px;color:#8fa39d;font-weight:500;letter-spacing:.3px}
.bell{position:relative;width:34px;height:34px;border-radius:10px;border:1px solid #22352f;background:#152824;display:grid;place-items:center;cursor:pointer}
.bell svg{width:16px;height:16px;stroke:#8fa39d;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bell .dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
#aScreen{flex:1;overflow-y:auto;padding:16px 16px 10px;-webkit-overflow-scrolling:touch}
.aTabs{
  display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));
}
.aTabs button{
  flex:1;border:0;background:none;cursor:pointer;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font:600 10px/1 "Instrument Sans",sans-serif;padding:6px 0;position:relative;
}
.aTabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.aTabs button.on{color:var(--accent)}
.aTabs .tBadge{position:absolute;top:0;right:calc(50% - 20px);background:var(--bad);color:#fff;font-size:9px;font-weight:700;border-radius:99px;min-width:15px;height:15px;display:grid;place-items:center;padding:0 3px}
.greet{font-size:12.5px;color:var(--ink3);margin:2px 2px 12px}
.greet b{color:var(--ink);font-size:15px;display:block;margin-bottom:1px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chips span{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:11.5px;color:var(--ink3)}
.chips b{color:var(--ink);font-variant-numeric:tabular-nums}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:11px}
.vc .top{display:flex;gap:8px;align-items:baseline}
.vc .t{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:0 0 42px}
.vc b{font-size:13.5px}
.vc .m{font-size:12px;color:var(--ink3);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:10.5px;font-weight:700;margin-left:auto}
.chip.ok{background:var(--ok-t);color:var(--ok-ink)}
.chip.warn{background:var(--warn-t);color:var(--warn-ink)}
.chip.bad{background:var(--bad-t);color:var(--bad-ink)}
.btn{
  border:0;background:var(--accent);color:var(--accent-on);font:700 12.5px "Instrument Sans",sans-serif;
  border-radius:11px;padding:10px 16px;cursor:pointer;margin-top:9px;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.btn.sm{padding:8px 13px;font-size:12px;margin-right:6px}
.hero{background:linear-gradient(145deg,var(--surface) 25%,var(--accent-soft));border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:12px}
.hero .l{font-size:11.5px;color:var(--ink2);font-weight:600}
.hero .v{font-size:33px;font-weight:680;letter-spacing:-.4px;margin:3px 0 1px}
.hero .d{font-size:11.5px;font-weight:650;color:var(--ok-ink)}
.hero .d span{color:var(--ink3);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 14px}
.tile .l{font-size:11px;color:var(--ink3);font-weight:600}
.tile .v{font-size:19px;font-weight:670;margin-top:3px}
.tile .s{font-size:10.5px;color:var(--ink3);margin-top:1px}
.sec{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin:16px 2px 9px}
.li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;font-weight:600;font-size:13.5px}
.li svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 18px}
.li .ch{margin-left:auto;color:var(--ink3);font-weight:400}
.li small{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.note{font-size:11.5px;color:var(--ink3);text-align:center;padding:10px 14px 4px;line-height:1.5}
.sheetWrap{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheetWrap.on{display:flex}
.sheetWrap .sc{position:absolute;inset:0;background:rgba(8,15,13,.5)}
.sheet{
  position:relative;background:var(--surface);border-radius:22px 22px 0 0;width:min(520px,100%);
  padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1);
}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.sheet h3{margin:0 0 3px;font-size:16px}
.sheet .m{font-size:12.5px;color:var(--ink3);margin-bottom:13px}
.amt{font-size:30px;font-weight:680;font-family:"Instrument Sans",sans-serif;border:1px solid var(--line);border-radius:13px;padding:11px 15px;background:var(--surface2);margin-bottom:5px}
.amt small{font-size:12px;color:var(--ink3);font-weight:500;display:block}
.mode{display:flex;gap:7px;margin:11px 0 3px}
.mode span{border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:12px;font-weight:600;color:var(--ink3);cursor:pointer}
.mode span.on{background:var(--accent-soft);color:var(--accent-2);border-color:var(--accent)}
#toast{
  position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--bg);padding:10px 17px;border-radius:12px;font-size:12.5px;font-weight:600;
  z-index:60;opacity:0;transition:all .28s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.35);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fin .3s ease}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<div id="app">
  <header class="aHead">
    <svg class="mark" width="32" height="32" viewBox="0 0 36 36" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8b26a"/><stop offset="1" stop-color="#9a7228"/></linearGradient></defs>
      <path d="M18 2 32 10v16L18 34 4 26V10Z" fill="none" stroke="url(#g)" stroke-width="2.4"/>
      <text x="18" y="22.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e9f5f1" font-family="Instrument Sans,sans-serif">EA</text>
    </svg>
    <h1 id="hTitle">EA 360<small id="hSub">Field workspace</small></h1>
    <button class="bell" id="bellBtn" aria-label="Approvals">
      <svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9Z"/><path d="M10 19.5a2.2 2.2 0 0 0 4 0"/></svg>
      <span class="dot" id="bellDot">3</span>
    </button>
  </header>
  <main id="aScreen"></main>
  <nav class="aTabs" id="aTabs"></nav>
</div>

<div class="sheetWrap" id="sheetWrap">
  <div class="sc" id="sheetSc"></div>
  <div class="sheet">
    <h3>Record payment</h3>
    <div class="m">Shree Balaji Traders · against SO-26-0201</div>
    <div class="amt">₹ 80,000<small>Amount received</small></div>
    <div class="mode" id="payMode"><span class="on">Cash</span><span>UPI</span><span>Cheque / PDC</span></div>
    <button class="btn" id="postRcpt" style="width:100%;margin-top:14px">Post receipt</button>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2800);}
function spark(d,c,w,h){
  const mx=Math.max(...d),mn=Math.min(...d),n=d.length;
  const pt=d.map((v,i)=>[3+(w-16)*i/(n-1),h-5-(v-mn)/(mx-mn)*(h-12)]);
  const ln=pt.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin-top:7px" aria-hidden="true">
    <path d="M${pt[0][0]},${h-3} L${ln.replace(/ /g,' L')} L${pt[n-1][0]},${h-3} Z" fill="${c}" opacity=".12"/>
    <polyline points="${ln}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pt[n-1][0]}" cy="${pt[n-1][1]}" r="3.5" fill="${c}" stroke="var(--surface)" stroke-width="2"/></svg>`;
}
const S={
  tab:'route',checkedIn:false,collected:false,claimed:false,payMode:'Cash',
  approvals:[
    {id:1,ref:'PO-26-0231',t:'PO — Gujarat Timber Imports',m:'Sal logs 290 CFT · raised by Prakash Iyer',v:'₹ 4,86,500',st:'pending'},
    {id:2,ref:'QTN-26-0148',t:'Special discount 8.5%',m:'Navkar Infra Projects · requested by Rohit',v:'₹ 12,45,600',st:'pending'},
    {id:3,ref:'PV-0871',t:'Payment — Shakti Packaging',m:'Against PO-26-0229 · due 22 Sep',v:'₹ 2,10,000',st:'pending'}
  ]
};
const pend=()=>S.approvals.filter(a=>a.st==='pending').length;
const TABS=[
  {id:'home',l:'Home',ic:'<path d="M4 11.5 12 4.5l8 7"/><path d="M6.5 10v9h11v-9"/>'},
  {id:'route',l:'My route',ic:'<circle cx="7" cy="6" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M7 8.5V13a3 3 0 0 0 3 3h4"/>'},
  {id:'approvals',l:'Approvals',badge:1,ic:'<circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.2 2.4 2.4 4.6-4.9"/>'},
  {id:'more',l:'More',ic:'<circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/>'}
];
const SUBS={home:'Business today · live',route:'Rohit Sawant · Pune territory',approvals:'Vikram Malhotra · Managing Director',more:'EA 360 · Unified Operations Platform'};

function rHome(){
  return `<div class="fade">
  <div class="hero"><div class="l">Revenue — September MTD</div><div class="v">₹ 72.4 L</div>
    <div class="d">▲ 18.2% <span>vs August MTD</span></div>
    ${spark([14.2,11.8,15.6,13.1,17.4,14.9,16.8,18.2,15.9,19.3,17.6,20.9],'var(--c1)',270,44)}</div>
  <div class="row2">
    <div class="tile"><div class="l">Collections overdue</div><div class="v">₹ 23.6 L</div><div class="s">4 customers · 1 on hold</div></div>
    <div class="tile"><div class="l">Open orders</div><div class="v">23</div><div class="s">₹ 1.18 Cr in fulfilment</div></div>
    <div class="tile"><div class="l">Dispatches today</div><div class="v">3</div><div class="s">550 CFT · 1 gate pass pending</div></div>
    <div class="tile"><div class="l">Pending approvals</div><div class="v" id="hAppr">${pend()}</div><div class="s">Tap the bell to clear them</div></div>
  </div>
  <div class="sec">Needs attention</div>
  <div class="vc"><div class="top"><b>Navkar Infra — ₹ 3.80 L overdue 64 days</b></div><div class="m">Collection visit planned 23 Sep · promise recorded</div></div>
  <div class="vc"><div class="top"><b>TMB-MRP-19 below reorder level</b></div><div class="m">618 sheets against minimum 800 · indent suggested</div></div>
  </div>`;
}
function rRoute(){
  const v3=S.checkedIn
    ?`<div class="top"><span class="t">14:07</span><b>Om Sai Timber Mart, Nashik Phata</b><span class="chip ok">GPS ✓</span></div><div class="m">Checked in · revised offer discussion</div>`
    :`<div class="top"><span class="t">14:05</span><b>Om Sai Timber Mart, Nashik Phata</b><span class="chip warn">Scheduled</span></div><div class="m">Revised offer discussion</div><button class="btn sm" id="ckBtn">Check in · GPS</button><button class="btn ghost sm">Reschedule</button>`;
  return `<div class="fade">
  <div class="greet"><b>Good afternoon, Rohit</b>Friday, 17 Oct · 3 visits planned</div>
  <div class="chips"><span>Done <b id="cDone">${S.checkedIn?3:2}</b>/3</span><span>Distance <b>64 km</b></span><span>Collected <b>${S.collected?'₹ 80,000':'₹ 0'}</b></span></div>
  <div class="vc"><div class="top"><span class="t">09:12</span><b>Shree Balaji Traders, Bhosari</b><span class="chip ok">GPS ✓</span></div>
    <div class="m">Order discussion · SO-26-0201 follow-up</div>
    ${S.collected?'<div class="m" style="color:var(--ok-ink);font-weight:650">₹ 80,000 collected · receipt RV-1184 posted</div>':'<button class="btn sm" id="payBtn">Record payment</button>'}</div>
  <div class="vc"><div class="top"><span class="t">11:40</span><b>Paramount Estates site, Hinjewadi</b><span class="chip ok">GPS ✓</span></div>
    <div class="m">Ghana teak 4×3 samples handed over · architect meeting</div></div>
  <div class="vc">${v3}</div>
  <div class="sec">Quick actions</div>
  <div class="vc"><div class="top"><b>Travel claim · 3 days · ₹ 12,480</b></div><div class="m">Pune territory · bills attached from camera</div>
    ${S.claimed?'<div class="m" style="color:var(--ok-ink);font-weight:650">Submitted · routed to Managing Director</div>':'<button class="btn ghost sm" id="clBtn">Submit claim</button>'}</div>
  <div class="note">Day-end movement report compiles automatically from your check-ins.</div>
  </div>`;
}
function rApprovals(){
  return `<div class="fade">
  <div class="greet"><b>Approvals</b>${pend()} waiting · you are the final approver</div>
  ${S.approvals.map(a=>`<div class="vc" ${a.st!=='pending'?'style="opacity:.6"':''}>
    <div class="top"><b>${a.t}</b>${a.st==='pending'?'':`<span class="chip ${a.st==='approved'?'ok':'bad'}">${a.st==='approved'?'Approved':'Rejected'}</span>`}</div>
    <div class="m"><span class="mono">${a.ref}</span> · ${a.m}</div>
    <div style="font-size:17px;font-weight:680;margin-top:4px">${a.v}</div>
    ${a.st==='pending'?`<button class="btn sm" data-ap="${a.id}" data-do="approved">Approve</button><button class="btn ghost sm" data-ap="${a.id}" data-do="rejected">Reject</button>`:'<div class="m">Logged to the audit trail with time and location</div>'}
  </div>`).join('')}
  <div class="note">Every decision posts to the same audit trail as the web platform — one system, two screens.</div>
  </div>`;
}
function rMore(){
  const li=(ic,t,s)=>`<div class="li"><svg viewBox="0 0 24 24">${ic}</svg><span>${t}${s?`<small>${s}</small>`:''}</span><span class="ch">›</span></div>`;
  return `<div class="fade">
  <div class="greet"><b>Rohit Sawant</b>Sales Head · signed in on this device</div>
  ${li('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.2 3.6-5 7-5s6.2 1.8 7 5"/>','My profile','Targets, territory, documents')}
  ${li('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>','Leave & attendance','2 CL remaining · Sep timesheet closed')}
  ${li('<path d="M4 19.5V16m5.3 3.5v-7M14.7 19.5v-4M20 19.5V8.5"/><path d="m4.5 11 4.8-4.2 4 2.8L19.5 4"/>','My performance','Weekly scorecard · 8.6 / 10')}
  ${li('<circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5l2.8 1.7"/>','Sync status','All entries synced · just now')}
  <div class="sec">Install</div>
  <div class="vc"><div class="top"><b>Add EA 360 to your home screen</b></div>
    <div class="m">Android: menu ⋮ → “Add to Home screen”. iPhone: Share → “Add to Home Screen”. It launches full-screen with its own icon — and keeps working when the network drops.</div></div>
  <div class="note">EA 360 v1.0 · by Eric’s Designs — Innovation through every pixel</div>
  </div>`;
}
const SCREENS={home:rHome,route:rRoute,approvals:rApprovals,more:rMore};

function render(){
  $('#aTabs').innerHTML=TABS.map(t=>`<button class="${S.tab===t.id?'on':''}" data-tab="${t.id}">
    <svg viewBox="0 0 24 24">${t.ic}</svg>${t.l}${t.badge&&pend()?`<span class="tBadge">${pend()}</span>`:''}</button>`).join('');
  $('#aScreen').innerHTML=SCREENS[S.tab]();
  $('#hSub').textContent=SUBS[S.tab];
  const n=pend();$('#bellDot').textContent=n;$('#bellDot').hidden=!n;
  $('#aScreen').scrollTop=0;
}
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){S.tab=tb.dataset.tab;render();return;}
  if(e.target.closest('#bellBtn')){S.tab='approvals';render();return;}
  const ap=e.target.closest('[data-ap]');
  if(ap){
    const a=S.approvals.find(x=>x.id==ap.dataset.ap);
    if(a&&a.st==='pending'){a.st=ap.dataset.do;toast(`${a.ref} ${a.st} — recorded in the audit trail`);render();}
    return;
  }
  if(e.target.closest('#ckBtn')){
    const b=$('#ckBtn');b.innerHTML='<span class="spin"></span>Locating…';
    setTimeout(()=>{S.checkedIn=true;toast('Check-in recorded · GPS location stamped');render();},900);
    return;
  }
  if(e.target.closest('#payBtn')){$('#sheetWrap').classList.add('on');return;}
  if(e.target.closest('#sheetSc')){$('#sheetWrap').classList.remove('on');return;}
  if(e.target.closest('#postRcpt')){
    $('#sheetWrap').classList.remove('on');S.collected=true;
    toast('Receipt RV-1184 posted · accounts notified');render();return;
  }
  if(e.target.closest('#clBtn')){S.claimed=true;toast('Claim TC-0913 submitted · routed to MD');render();return;}
  const pm=e.target.closest('#payMode span');
  if(pm){document.querySelectorAll('#payMode span').forEach(x=>x.classList.remove('on'));pm.classList.add('on');}
});
render();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
</script>
</body>
</html>
